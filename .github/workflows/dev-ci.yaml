  update-deployment-repo:
    name: Checkout Deployment Repository (GitLab)
    # needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deployment Repository
        run: |
          git config --global url."https://${{ secrets.REPO_ACCESS_TOKEN }}@gitlab.com/".insteadOf https://gitlab.com/
          git clone --depth 1 https://gitlab.com/learn-things1/argocd-basic.git argocd-basic
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          cd agrocd-basic
          # Update the image tag in deployment file
          sed -i "s|image: yepsamii/fe-boilerplate:.*|image: yepsamii/fe-boilerplate:v1.${{ github.run_number }}|" fe-boilerplate/deployment.yaml

          # Print the change for verification
          echo "Updated image tag to: yepsamii/fe-boilerplate:v1.${{ github.run_number }}"

          # Verify the change
          grep "image: yepsamii/fe-boilerplate" fe-boilerplate/deployment.yaml

      - name: Commit and Push Changes
        run: |
          cd argocd-basic
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "Update fe-boilerplate image tag to v1.${{ github.run_number }} [skip ci]"
          git push
